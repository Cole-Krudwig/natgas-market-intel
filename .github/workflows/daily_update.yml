name: Daily Commodity Data Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily updates
        env:
          EIA_KEY: ${{ secrets.EIA_KEY }}
          NOAA_KEY: ${{ secrets.NOAA_KEY }}
        run: |
          python src/natgas-market-intel/scripts/update_all.py

      - name: Commit updated data
        run: |
          git config user.name "commodity-market-intel-bot"
          git config user.email "actions@github.com"

          git add src/natgas-market-intel/data/commodities.duckdb

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update commodity market data"
            git push
          fi